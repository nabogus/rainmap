name: Fetch rain data and deploy to GitHub Pages

on:
  schedule:
    - cron: "*/15 * * * *"     # ทุก 15 นาที (GitHub อาจหน่วงได้หลายนาที)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch radar + forecast
        run: python fetch.py
      - name: Assemble site
        run: |
          mkdir -p site
          cp index.html app.js style.css site/
          cp -r data site/data
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
